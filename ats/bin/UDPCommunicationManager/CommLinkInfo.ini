; CommLinkInfo.ini ??ATS receiver (ROLE=RECEIVE)
; Mode: Local (5 sims on one PC) | MULTICAST 239.255.0.1:10000
; LOCAL PORT must match MULTICAST PORT
; Local integration: 5 processes on one PC share PORT 10000 (nFramework SO_REUSEADDR).

[LOCAL]
IP = 127.0.0.1
PORT = 10000

[REMOTE]
IP = 239.255.0.1
PORT = 10000

[SERVICE]
PROTOCOL = UDP
ROLE = RECEIVE
CAST = MULTICAST

[MULTICAST]
IP = 239.255.0.1
PORT = 10000

[HEADER]
SIZE = 8
ID_POS = 0
ID_SIZE = 4
LEN_POS = 4
LEN_SIZE = 4
