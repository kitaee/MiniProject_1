; CommLinkInfo.ini ??TCC sender (ROLE=SEND)
; Mode: Local (5 sims on one PC) | MULTICAST 239.255.0.1:10000
; LOCAL PORT must match MULTICAST PORT
; Local integration: 5 processes on one PC share PORT 10000 (nFramework SO_REUSEADDR).

[LOCAL]
IP = 172.16.12.223
PORT = 10000

[MULTICAST]
IP =239.192.1.1
PORT=10000

[SERVICE]
PROTOCOL = UDP
ROLE = SEND
CAST = MULTICAST

[MULTICAST]
IP = 239.255.0.1
PORT = 10000

[HEADER]
SIZE = 8
ID_POS = 0
ID_SIZE = 4
LEN_POS = 4
LEN_SIZE = 4
