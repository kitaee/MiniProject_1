; nFConnect.ini — C# GUI ↔ C++ Manager plug-in (MiniProject pattern)
; 인코딩: UTF-8
; ComponentsOnNFConnect: C# WPF ↔ UIManager 브릿지 (MANAGER 키워드)
; Components: nFramework DLL plug-in 목록 (DLL 키워드)

[SchemaRegistryData]
USE = true
PATH =
XML = SchemaRegistryData.xml
CheckMsgIDDuplication = false

[nLogger]
USE = true

[ValidatingComponents]
USE = true

[ComponentsOnNFConnect]
Count = 1

[ComponentOnNFConnect_1]
PATH = UIManager
MANAGER = UIManager
XML = UIManager.xml

[Components]
Count = 5

; UIManager + UDP only for GUI bring-up; stub managers off until implemented

[Component_1]
PATH = UIManager
DLL = UIManager
XML = UIManager.xml
POWER = on

[Component_2]
PATH = ControlManager
DLL = ControlManager
XML = ControlManager.xml
POWER = off

[Component_3]
PATH = ScenarioManager
DLL = ScenarioManager
XML = ScenarioManager.xml
POWER = off

[Component_4]
PATH = StatusManager
DLL = StatusManager
XML = StatusManager.xml
POWER = off

[Component_5]
PATH = UDPCommunicationManager
DLL = UDPCommunicationManager
XML = UDPCommunicationManager.xml
POWER = on
